<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::#main-content})}">
<head>
    <title>產品列表</title>
</head>
<body>
    <div id="main-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>產品列表</h2>
            <a th:href="@{/products/new}" class="btn btn-primary">+ 新增產品</a>
        </div>

        <form th:action="@{/products}" method="get" class="row g-2 mb-3">
            <div class="col-md-4">
                <input type="text" name="keyword" th:value="${keyword}"
                       class="form-control" placeholder="搜尋商品名稱..." />
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-secondary w-100">搜尋</button>
            </div>
        </form>

        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID</th><th>名稱</th><th>分類</th><th>價格</th><th>庫存</th><th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${products}">
                    <td th:text="${p.id}">1</td>
                    <td th:text="${p.name}">名稱</td>
                    <td th:text="${p.category != null ? p.category.name : '未分類'}">分類</td>
                    <td th:text="${p.price}">0.00</td>
                    <td th:text="${p.stock}">0</td>
                    <td>
                        <a th:href="@{/products/{id}(id=${p.id})}" class="btn btn-sm btn-info text-white">查看</a>
                        <a th:href="@{/products/{id}/edit(id=${p.id})}" class="btn btn-sm btn-warning">編輯</a>
                        <a th:href="@{/products/{id}/delete(id=${p.id})}" class="btn btn-sm btn-danger" onclick="return confirm('確定要刪除嗎？')">刪除</a>
                    </td>
                </tr>
                <tr th:if="${products == null or #lists.isEmpty(products)}">
                    <td colspan="6" class="text-center text-muted">目前沒有任何產品資料</td>
                </tr>
            </tbody>
        </table>

        <!-- 分頁按鈕，只有超過一頁時才顯示 -->
        <nav th:if="${totalPages > 1}" aria-label="分頁">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/products(page=${i}, keyword=${keyword})}" th:text="${i + 1}"></a>
                </li>
            </ul>
        </nav>

        <p class="text-center text-muted" th:if="${totalItems > 0}">
            共 <span th:text="${totalItems}"></span> 筆資料
        </p>
    </div>
</body>
</html>
