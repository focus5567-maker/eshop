<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::#main-content})}">
<head>
    <title>新增/編輯產品</title>
</head>
<body>
    <div id="main-content">
        <h2>新增產品</h2>
        <form th:action="@{/products}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}" />
            <div class="mb-3">
                <label for="name" class="form-label">產品名稱：</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" required />
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">價格：</label>
                <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control" required />
            </div>
            <div class="mb-3">
                <label for="stock" class="form-label">庫存數量：</label>
                <input type="number" id="stock" th:field="*{stock}" class="form-control" required />
            </div>
            <div class="mb-3">
                <label for="category" class="form-label">商品分類：</label>
                <select id="category" th:field="*{category}" class="form-select">
                    <option value="">-- 請選擇分類 --</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-success">儲存產品</button>
            <a th:href="@{/products}" class="btn btn-secondary">返回列表</a>
        </form>
    </div>
</body>
</html>
