<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::#main-content})}">
<head>
    <title>新增分類</title>
</head>
<body>
    <div id="main-content">
        <h2>新增分類</h2>
        <form th:action="@{/categories}" th:object="${category}" method="post">
            <div class="mb-3">
                <label for="name" class="form-label">分類名稱：</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" required />
            </div>
            <div class="mb-3">
                <label for="sortOrder" class="form-label">排序(數字越小越前面)：</label>
                <input type="number" id="sortOrder" th:field="*{sortOrder}" class="form-control" />
            </div>
            <button type="submit" class="btn btn-success">儲存分類</button>
            <a th:href="@{/categories}" class="btn btn-secondary">返回列表</a>
        </form>
    </div>
</body>
</html>
