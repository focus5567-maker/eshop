<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::#main-content})}">
<head>
    <title>分類列表</title>
</head>
<body>
    <div id="main-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>分類列表</h2>
            <a th:href="@{/categories/new}" class="btn btn-primary">+ 新增分類</a>
        </div>
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr><th>ID</th><th>名稱</th><th>排序</th><th>操作</th></tr>
            </thead>
            <tbody>
                <tr th:each="c : ${categories}">
                    <td th:text="${c.id}"></td>
                    <td th:text="${c.name}"></td>
                    <td th:text="${c.sortOrder}"></td>
                    <td>
                        <a th:href="@{/categories/{id}/delete(id=${c.id})}" class="btn btn-sm btn-danger" onclick="return confirm('確定要刪除嗎？')">刪除</a>
                    </td>
                </tr>
                <tr th:if="${categories == null or #lists.isEmpty(categories)}">
                    <td colspan="4" class="text-center text-muted">目前沒有任何分類資料</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
