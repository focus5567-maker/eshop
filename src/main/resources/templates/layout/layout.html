<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <title th:replace="${title}">電商系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/products}">🛒 電商系統</a>
            <div>
                <a class="btn btn-outline-light btn-sm me-2" th:href="@{/products}">產品管理</a>
                <a class="btn btn-outline-light btn-sm me-2" th:href="@{/categories}">分類管理</a>
                <a class="btn btn-outline-light btn-sm me-2" th:href="@{/shop}">商品搜尋</a>
                <a class="btn btn-outline-light btn-sm me-2" th:href="@{/cart}">購物車</a>

                <span th:if="${session.username != null}" class="text-white me-2"
                      th:text="'歡迎, ' + ${session.username}">歡迎</span>
                <a th:if="${session.username != null}" class="btn btn-outline-light btn-sm" th:href="@{/logout}">登出</a>

                <a th:if="${session.username == null}" class="btn btn-outline-light btn-sm me-2" th:href="@{/login}">登入</a>
                <a th:if="${session.username == null}" class="btn btn-outline-light btn-sm" th:href="@{/register}">註冊</a>
            </div>
        </div>
    </nav>

    <main class="container mb-5" th:replace="${content}">
        <p>預設內容（會被子頁面覆蓋）</p>
    </main>

    <footer class="text-center text-muted py-3 border-top mt-auto">
        &copy; 2026 電商系統 All Rights Reserved.
    </footer>
</body>
</html>
